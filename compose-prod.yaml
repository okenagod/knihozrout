services:
  laravel.app:
    image: ghcr.io/okenagod/knihozrout/laravel-app:latest
    container_name: laravel_app
    restart: always
    env_file: .env
    depends_on:
      - mysql
    volumes:
      - app-public:/var/www/html/public
      - production-app-storage:/var/www/html/storage
      - ./google-auth.json:/var/www/html/google-auth.json
    networks:
      - backend

  laravel.worker:
    image: ghcr.io/okenagod/knihozrout/laravel-app:latest
    restart: always
    env_file: .env
    command: sh -c "php artisan config:clear && php artisan queue:work --memory=64 --sleep=3 --tries=3"
    depends_on:
      - mysql
    volumes:
      - production-app-storage:/var/www/html/storage
      - ./google-auth.json:/var/www/html/google-auth.json
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

  # Webový server (Nginx)
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80" # Port 8080 bude ten, který zadáš do NPM
    volumes:
      - app-public:/var/www/html/public
      - production-public-storage:/var/www/html/public/storage
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel.app
    networks:
      - backend
      - proxy_network

  # Databáze
  mysql:
    image: 'mysql:8.4'
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'production-db-data:/var/lib/mysql'
    networks:
      - backend

networks:
  backend:
    driver: bridge
  proxy_network:
    external: true # Tato síť už existuje (vytvořili jsme ji pro NPM)

volumes:
  production-db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/volume/knihozrout/db
  production-app-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/volume/knihozrout/storage
  production-public-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/volume/knihozrout/storage/app/public
  app-public:
